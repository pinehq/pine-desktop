# Ubuntu 26.04 GNOME smoke-test VM for macOS developers.
minimumLimaVersion: 2.2.0

base:
  - template:_images/ubuntu

vmType: vz
arch: default
cpus: 6
memory: 8GiB
disk: 30GiB
mountType: virtiofs

containerd:
  system: false
  user: false

video:
  display: vz

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail

      export DEBIAN_FRONTEND=noninteractive
      echo "gdm3 shared/default-x-display-manager select gdm3" | debconf-set-selections
      apt-get update
      apt-get install --yes \
        build-essential \
        ca-certificates \
        curl \
        dbus-x11 \
        git \
        libadwaita-1-dev \
        libgtk-4-dev \
        libgtksourceview-5-dev \
        libvte-2.91-gtk4-dev \
        nodejs \
        npm \
        pkg-config \
        ubuntu-desktop-minimal

      if ! grep -q '^AutomaticLogin={{.User}}$' /etc/gdm3/custom.conf; then
        sed -i \
          '/^\[daemon\]/a AutomaticLoginEnable=true\nAutomaticLogin={{.User}}' \
          /etc/gdm3/custom.conf
      fi
      if grep -q '^#\?WaylandEnable=' /etc/gdm3/custom.conf; then
        sed -i 's/^#\?WaylandEnable=.*/WaylandEnable=true/' /etc/gdm3/custom.conf
      else
        sed -i '/^\[daemon\]/a WaylandEnable=true' /etc/gdm3/custom.conf
      fi

      systemctl set-default graphical.target
      systemctl enable gdm3.service
      systemctl start gdm3.service

  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail

      # Install the released pine package from the project APT repository,
      # so the smoke-test VM exercises the same channel as end users.
      base_url=https://pinehq.github.io/pine-desktop/apt
      keyring=/usr/share/keyrings/pine.gpg
      architecture="$(dpkg --print-architecture)"
      curl --proto '=https' --tlsv1.2 -fsSL "${base_url}/pubkey.gpg" |
        gpg --dearmor > "${keyring}"
      echo "deb [arch=${architecture} signed-by=${keyring}] ${base_url} stable main" \
        > /etc/apt/sources.list.d/pine.list
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install --yes pine

  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail

      if [ ! -x "${HOME}/.cargo/bin/rustup" ]; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
          sh -s -- -y --profile minimal --default-toolchain 1.96.1
      fi
      "${HOME}/.cargo/bin/rustup" toolchain install 1.96.1 \
        --component clippy \
        --component rustfmt \
        --profile minimal

      dbus-run-session gsettings set \
        org.gnome.desktop.peripherals.mouse natural-scroll true
      dbus-run-session gsettings set \
        org.gnome.desktop.peripherals.touchpad natural-scroll true
      dbus-run-session gsettings set \
        org.gnome.desktop.screensaver lock-enabled false
      dbus-run-session gsettings set \
        org.gnome.desktop.session idle-delay 0

      curl --proto '=https' --tlsv1.2 -fsSL \
        https://chatgpt.com/codex/install.sh | sh
      curl --proto '=https' --tlsv1.2 -fsSL \
        https://claude.ai/install.sh | bash -s stable
      curl --proto '=https' --tlsv1.2 -fsSL \
        https://pi.dev/install.sh | sh

probes:
  - mode: readiness
    description: GNOME, the Rust toolchain, and the released pine package
    script: |
      #!/bin/bash
      set -eu
      test -x "${HOME}/.cargo/bin/cargo"
      test -x /usr/bin/pine
      systemctl is-enabled gdm3.service >/dev/null

message: |
  Pine GNOME VM is ready.
  GNOME is shown in the native Virtualization.framework display window.
  The released pine package from the project APT repository is installed
  as /usr/bin/pine; refresh or reinstall it with ./dev/lima/install-pine-apt.sh
  Codex, Claude Code, and Pi are installed in ~/.local/bin.
  Build from the mounted project: cargo run -p pine-linux
